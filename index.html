<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수능 시간표 타이머</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>수능 시간표 타이머</h1>
      <p class="subtitle">과목을 선택하고 시작하세요. 종료 전 안내와 알림음이 자동으로 울립니다.</p>
    </header>

    <section class="subject-list" id="subjectList" aria-label="과목 선택"></section>

    <section class="timer-panel">
      <div class="timer-panel-header">
        <span class="current-subject" id="currentSubject">과목을 선택하세요</span>
        <span class="current-meta" id="currentMeta"></span>
      </div>

      <div class="progress-ring-wrap">
        <svg class="progress-ring" width="260" height="260" viewBox="0 0 260 260">
          <circle class="ring-bg" cx="130" cy="130" r="118"></circle>
          <circle class="ring-fg" id="ringFg" cx="130" cy="130" r="118"></circle>
        </svg>
        <div class="time-display" id="timeDisplay">00:00</div>
      </div>

      <div class="controls">
        <button id="startBtn" class="btn btn-primary" disabled>시작</button>
        <button id="pauseBtn" class="btn" disabled>일시정지</button>
        <button id="resetBtn" class="btn" disabled>초기화</button>
      </div>

      <div class="options">
        <label>
          <input type="checkbox" id="soundToggle" checked />
          알림음 사용
        </label>
        <label>
          <input type="checkbox" id="autoNextToggle" />
          종료 후 다음 과목 자동 대기
        </label>
      </div>

      <div class="villain-panel">
        <span class="villain-title">수능빌런 소리 (실전 연습용 소음) · 시작 버튼을 눌러야 재생돼요</span>
        <div class="villain-row">
          <label>
            <input type="checkbox" id="legVillainToggle" />
            🦵 다리떨기 빌런
          </label>
          <button type="button" class="btn btn-preview" id="legVillainPreview">미리듣기</button>
        </div>
        <div class="villain-row">
          <label>
            <input type="checkbox" id="paperVillainToggle" />
            📄 종이넘기기 빌런
          </label>
          <button type="button" class="btn btn-preview" id="paperVillainPreview">미리듣기</button>
        </div>
      </div>
    </section>

    <div class="banner" id="banner"></div>
  </div>

<script src="script.js"></script>
</body>
</html>
